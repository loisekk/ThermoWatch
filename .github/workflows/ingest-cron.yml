name: ingest-cron
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: warm API + ingest one batch
        run: |
          curl -sf --retry 4 --retry-delay 15 --retry-all-errors "$TW_API_URL/api/v1/healthz" > /dev/null
          cd server/ingest && SINGLE_SHOT=1 bun run src/main.ts
        env:
          TW_API_URL: ${{ secrets.TW_API_URL }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          TW_INGEST_TOKEN: ${{ secrets.TW_INGEST_TOKEN }}
